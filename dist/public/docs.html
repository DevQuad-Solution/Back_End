<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlashIt API Documentation</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css"
    />
    <style>
      html {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }
      body {
        margin: 0;
        padding: 0;
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-standalone-preset.js"></script>
    <script>
      const spec = {
        openapi: '3.0.0',
        info: {
          title: 'SlashIt API',
          description:
            'SlashIt Backend API - A collaborative purchasing platform for group buying and pooling resources',
          version: '1.0.0',
          contact: {
            name: 'SlashIt Support',
            url: 'https://slashit.com',
          },
          license: {
            name: 'ISC',
          },
        },
        servers: [
          {
            url: 'http://localhost:5004',
            description: 'Development Server',
          },
          {
            url: 'https://slashit-g2og.onrender.com',
            description: 'Test Production Server',
          },
        ],
        components: {
          securitySchemes: {
            BearerAuth: {
              type: 'http',
              scheme: 'bearer',
              bearerFormat: 'JWT',
              description: 'JWT token required in Authorization header',
            },
          },
          schemas: {
            User: {
              type: 'object',
              properties: {
                _id: { type: 'string', description: 'User ID' },
                name: { type: 'string' },
                email: { type: 'string', format: 'email' },
                phone: { type: 'string' },
                role: { type: 'string', enum: ['user', 'admin', 'attendant'] },
                emailVerified: { type: 'boolean' },
                walletBalance: { type: 'number' },
                hub: { type: 'string', description: 'Hub ID' },
                status: { type: 'string', enum: ['active', 'suspended'] },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            Product: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                name: { type: 'string' },
                category: { type: 'string' },
                description: { type: 'string' },
                emoji: { type: 'string' },
                quantity: { type: 'integer' },
                noOfSlots: { type: 'integer' },
                totalValue: { type: 'number' },
                pricePerSlot: { type: 'number' },
                status: { type: 'string', enum: ['Active', 'Inactive'] },
                partner: { type: 'string' },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            Slash: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                product: { $ref: '#/components/schemas/Product' },
                hub: { type: 'string' },
                status: {
                  type: 'string',
                  enum: ['open', 'purchasing', 'pickup', 'completed', 'dissolved'],
                },
                timeLimit: { type: 'string' },
                joined: {
                  type: 'array',
                  items: {
                    type: 'object',
                    properties: {
                      user: { type: 'string' },
                      claimed: { type: 'boolean' },
                      qrCode: { type: 'string' },
                      claimCode: { type: 'string' },
                    },
                  },
                },
                createdBy: { type: 'string' },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            Hub: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                name: { type: 'string' },
                address: { type: 'string' },
                city: { type: 'string' },
                state: { type: 'string' },
                transportCost: { type: 'number' },
                status: { type: 'string', enum: ['active', 'inactive', 'suspended'] },
                attendant: { type: 'string' },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            Notification: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                title: { type: 'string' },
                message: { type: 'string' },
                users: {
                  type: 'array',
                  items: { type: 'string' },
                },
                read: { type: 'boolean' },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            TransactionHistory: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                type: { type: 'string', enum: ['transfer', 'deduction', 'refund'] },
                userId: { type: 'string' },
                amount: { type: 'number' },
                trxReference: { type: 'string' },
                trxDate: { type: 'string', format: 'date-time' },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            FraudAssessment: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                userId: { type: 'string' },
                riskScore: { type: 'number', minimum: 0, maximum: 100 },
                riskLevel: { type: 'string', enum: ['low', 'medium', 'high', 'critical'] },
                flags: { type: 'array', items: { type: 'string' } },
                recommendation: { type: 'string', enum: ['allow', 'monitor', 'hold', 'block'] },
                reasoning: { type: 'string' },
                trigger: {
                  type: 'string',
                  enum: ['wallet_topup', 'slash_join', 'kyc_submit', 'manual'],
                },
                layer: { type: 'integer', enum: [1, 2] },
                adminAction: { type: 'string', enum: ['cleared', 'watching', 'blocked'] },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            AISettings: {
              type: 'object',
              properties: {
                radarEnabled: { type: 'boolean' },
                fraudEnabled: { type: 'boolean' },
                retentionEnabled: { type: 'boolean' },
                dailyBudgetUsd: { type: 'number' },
                pausedForBudget: { type: 'boolean' },
                minRadarScore: { type: 'number' },
              },
            },
            RadarDeal: {
              type: 'object',
              properties: {
                _id: { type: 'string' },
                productName: { type: 'string' },
                pricePerSlot: { type: 'number' },
                slotsLeft: { type: 'integer' },
                radarScore: { type: 'number' },
                expiresAt: { type: 'string' },
                radarHeadline: { type: 'string' },
              },
            },
            PlatformConfig: {
              type: 'object',
              properties: {
                processingFeePerSlot: { type: 'number' },
                insuranceRatePct: { type: 'number' },
                defaultTransportFee: { type: 'number' },
                maxSlashDurationHours: { type: 'number' },
                cancellationPenaltyPct: { type: 'number' },
                minSlotsPerSlash: { type: 'number' },
                minTopupAmount: { type: 'number' },
              },
            },
            PaymentSettings: {
              type: 'object',
              properties: {
                paymentProvider: { type: 'string' },
                payoutProvider: { type: 'string' },
                escrowReleaseTrigger: {
                  type: 'string',
                  enum: ['Attendant Verification', 'Auto'],
                },
              },
            },
            KycSettings: {
              type: 'object',
              properties: {
                kycRequiredToJoin: { type: 'boolean' },
                kycProvider: { type: 'string' },
                ninVerification: { type: 'string', enum: ['Enabled', 'Disabled'] },
              },
            },
            FeatureFlags: {
              type: 'object',
              properties: {
                hosteLeaderboard: { type: 'boolean' },
                banterBoard: { type: 'boolean' },
                referralProgram: { type: 'boolean' },
                paidPlanPackages: { type: 'boolean' },
                foodPackages: { type: 'boolean' },
                walletFunding: { type: 'boolean' },
                transportation: { type: 'boolean' },
              },
            },
            ErrorResponse: {
              type: 'object',
              properties: {
                status: { type: 'integer' },
                message: { type: 'string' },
                type: { type: 'string' },
              },
            },
          },
        },
        paths: {
          // ==================== HEALTH ROUTES ====================
          '/': {
            get: {
              tags: ['Health Check'],
              summary: 'Root test route',
              responses: { 200: { description: 'Server is working' } },
            },
          },
          '/health': {
            get: {
              tags: ['Health Check'],
              summary: 'Health check endpoint',
              responses: { 200: { description: 'Server health status' } },
            },
          },
          '/api/test': {
            get: {
              tags: ['Health Check'],
              summary: 'API test route',
              responses: { 200: { description: 'API is working' } },
            },
          },

          // ==================== AUTHENTICATION ROUTES ====================
          '/api/auth/': {
            post: {
              tags: ['Authentication'],
              summary: 'User signup',
              description: 'Create a new user account',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        fullName: { type: 'string' },
                        email: { type: 'string', format: 'email' },
                        phoneNumber: { type: 'string' },
                        password: { type: 'string', format: 'password' },
                      },
                      required: ['fullName', 'email', 'phoneNumber', 'password'],
                    },
                  },
                },
              },
              responses: {
                201: { description: 'Account created successfully' },
                400: { description: 'Validation error' },
                403: { description: 'Email already exists' },
              },
            },
          },
          '/api/auth/signin': {
            post: {
              tags: ['Authentication'],
              summary: 'User signin',
              description: 'Login with email/phone and password',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        identifier: { type: 'string', description: 'Email or phone number' },
                        password: { type: 'string', format: 'password' },
                      },
                      required: ['identifier', 'password'],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Login successful' },
                400: { description: 'Invalid credentials' },
              },
            },
          },
          '/api/auth/code': {
            post: {
              tags: ['Authentication'],
              summary: 'Send verification code',
              description: 'Request OTP code to be sent to email',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        email: { type: 'string', format: 'email' },
                        reason: { type: 'string', enum: ['signup', 'forgot_password'] },
                      },
                      required: ['email', 'reason'],
                    },
                  },
                },
              },
              responses: { 200: { description: 'Code sent successfully' } },
            },
          },
          '/api/auth/verify-code': {
            post: {
              tags: ['Authentication'],
              summary: 'Verify code',
              description: 'Verify the OTP code sent to email',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        email: { type: 'string', format: 'email' },
                        code: { type: 'string' },
                        reason: { type: 'string' },
                      },
                      required: ['email', 'code', 'reason'],
                    },
                  },
                },
              },
              responses: { 200: { description: 'Code verified successfully' } },
            },
          },
          '/api/auth/onboarding': {
            post: {
              tags: ['Authentication'],
              summary: 'Complete user onboarding',
              description: 'Finalize user registration and create wallet',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        token: { type: 'string' },
                        email: { type: 'string', format: 'email' },
                        hubId: { type: 'string' },
                      },
                      required: ['token', 'email', 'hubId'],
                    },
                  },
                },
              },
              responses: { 200: { description: 'Onboarding completed' } },
            },
          },
          '/api/auth/reset-password': {
            post: {
              tags: ['Authentication'],
              summary: 'Reset password',
              description: 'Reset user password after verification',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        email: { type: 'string' },
                        newPassword: { type: 'string' },
                      },
                    },
                  },
                },
              },
              responses: { 200: { description: 'Password reset successfully' } },
            },
          },
          '/api/auth/me': {
            get: {
              tags: ['Authentication'],
              summary: 'Get current user',
              security: [{ BearerAuth: [] }],
              responses: {
                200: { description: 'User data retrieved' },
                401: { description: 'Unauthorized' },
              },
            },
          },
          '/api/auth/kyc': {
            post: {
              tags: ['Authentication'],
              summary: 'Verify KYC',
              description: 'Submit NIN and photo for KYC verification',
              security: [{ BearerAuth: [] }],
              requestBody: {
                required: true,
                content: {
                  'multipart/form-data': {
                    schema: {
                      type: 'object',
                      properties: {
                        nin: {
                          type: 'string',
                          minLength: 11,
                          maxLength: 11,
                          description: '11-digit NIN number',
                        },
                        image: {
                          type: 'array',
                          items: {
                            type: 'string',
                            format: 'binary',
                            description: 'User photo for verification',
                          },
                        },
                        consent: { type: 'boolean', description: 'Consent for NIN verification' },
                      },
                      required: ['nin', 'image'],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'KYC verification successful' },
                400: { description: 'Verification failed or insufficient balance' },
                401: { description: 'Unauthorized' },
              },
            },
          },
          '/api/auth/admin/signin': {
            post: {
              tags: ['Admin - Auth'],
              summary: 'Admin signin',
              description: 'Login with email/phone and password',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        identifier: { type: 'string', description: 'Email or phone number' },
                        password: { type: 'string', format: 'password' },
                      },
                      required: ['identifier', 'password'],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Login successful' },
                400: { description: 'Invalid credentials' },
              },
            },
          },
          '/api/auth/attendant/signin': {
            post: {
              tags: ['Attendant Auth'],
              summary: 'Attendant signin',
              description: 'Login with email/phone and password',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        identifier: { type: 'string', description: 'Email or phone number' },
                        password: { type: 'string', format: 'password' },
                      },
                      required: ['identifier', 'password'],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Login successful' },
                400: { description: 'Invalid credentials' },
              },
            },
          },
          '/api/auth/refresh': {
            post: {
              tags: ['Auth'],
              summary: 'Refresh access token',
              description: 'Refresh accounts access token',
              requestBody: {
                required: false,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        refreshToken: { type: 'string', description: 'Users refresh token saved in cookies (Optional)' },
                      },
                      required: [],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Access token refreshed successfully' },
                401: { description: 'Token Expired' },
              },
            },
          },

          // ==================== AI RADAR ROUTES ====================
          '/api/ai/radar': {
            get: {
              tags: ['AI - Food Radar'],
              summary: 'Get radar deals',
              description: 'Returns top 5 radar-scored active slashes for a hub',
              parameters: [
                {
                  name: 'hubId',
                  in: 'query',
                  required: true,
                  schema: { type: 'string' },
                  description: 'Hub ID',
                },
              ],
              responses: {
                200: {
                  description: 'Radar deals retrieved',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          data: {
                            type: 'object',
                            properties: {
                              hubId: { type: 'string' },
                              deals: {
                                type: 'array',
                                items: { $ref: '#/components/schemas/RadarDeal' },
                              },
                              cachedAt: { type: 'string', format: 'date-time' },
                            },
                          },
                        },
                      },
                    },
                  },
                },
              },
            },
          },

          // ==================== AI FRAUD DETECTION ROUTES ====================
          '/api/admin/ai/fraud-queue': {
            get: {
              tags: ['AI - Fraud Detection'],
              summary: 'Get fraud queue',
              description: 'Returns all fraud assessments with high or critical risk level',
              security: [{ BearerAuth: [] }],
              responses: {
                200: {
                  description: 'Fraud queue retrieved',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          data: {
                            type: 'object',
                            properties: {
                              total: { type: 'integer' },
                              assessments: {
                                type: 'array',
                                items: { $ref: '#/components/schemas/FraudAssessment' },
                              },
                            },
                          },
                        },
                      },
                    },
                  },
                },
              },
            },
          },
          '/api/admin/ai/fraud-queue/{assessmentId}': {
            patch: {
              tags: ['AI - Fraud Detection'],
              summary: 'Resolve fraud assessment',
              description: 'Admin resolves a fraud flag',
              security: [{ BearerAuth: [] }],
              parameters: [
                { name: 'assessmentId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        action: { type: 'string', enum: ['cleared', 'watching', 'blocked'] },
                      },
                      required: ['action'],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Assessment resolved' },
                404: { description: 'Assessment not found' },
              },
            },
          },
          '/api/admin/ai/fraud-stats': {
            get: {
              tags: ['AI - Fraud Detection'],
              summary: 'Get fraud stats',
              description: 'Returns summary counts for fraud dashboard',
              security: [{ BearerAuth: [] }],
              responses: {
                200: {
                  description: 'Statistics retrieved',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          data: {
                            type: 'object',
                            properties: {
                              total: { type: 'integer' },
                              critical: { type: 'integer' },
                              high: { type: 'integer' },
                              pending: { type: 'integer' },
                              resolvedToday: { type: 'integer' },
                            },
                          },
                        },
                      },
                    },
                  },
                },
              },
            },
          },
          '/api/admin/ai/fraud-queue/trigger': {
            post: {
              tags: ['AI - Fraud Detection'],
              summary: 'Trigger manual fraud check',
              description: 'Manually run fraud check on a user',
              security: [{ BearerAuth: [] }],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        userId: { type: 'string' },
                        trigger: {
                          type: 'string',
                          enum: ['manual', 'wallet_topup', 'slash_join', 'kyc_submit'],
                        },
                      },
                      required: ['userId'],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Fraud analysis queued' },
              },
            },
          },

          // ==================== AI RADAR ADMIN ROUTES ====================
          '/api/admin/ai/radar/trigger': {
            post: {
              tags: ['AI - Food Radar'],
              summary: 'Trigger radar run',
              description: 'Immediately runs the Food Radar for a specific hub',
              security: [{ BearerAuth: [] }],
              requestBody: {
                required: false,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        hubId: {
                          type: 'string',
                          description: 'Optional: Run for specific hub only',
                        },
                      },
                    },
                  },
                },
              },
              responses: {
                200: {
                  description: 'Radar run started',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          message: { type: 'string' },
                          data: {
                            type: 'object',
                            properties: {
                              slashesScored: { type: 'integer' },
                              notificationsSent: { type: 'integer' },
                            },
                          },
                        },
                      },
                    },
                  },
                },
              },
            },
          },
          '/api/admin/ai/radar/logs': {
            get: {
              tags: ['AI - Food Radar'],
              summary: 'Get radar run logs',
              description: 'Returns last 20 radar run summaries',
              security: [{ BearerAuth: [] }],
              responses: {
                200: {
                  description: 'Logs retrieved',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          data: {
                            type: 'object',
                            properties: {
                              logs: {
                                type: 'array',
                                items: {
                                  type: 'object',
                                  properties: {
                                    runAt: { type: 'string', format: 'date-time' },
                                    tokensUsed: { type: 'integer' },
                                    estimatedCostUsd: { type: 'number' },
                                  },
                                },
                              },
                            },
                          },
                        },
                      },
                    },
                  },
                },
              },
            },
          },

          // ==================== AI SETTINGS ROUTES ====================
          '/api/admin/ai/settings': {
            get: {
              tags: ['AI - Settings'],
              summary: 'Get AI settings',
              description: 'Returns current AI feature toggle states and budget configuration',
              security: [{ BearerAuth: [] }],
              responses: {
                200: {
                  description: 'Settings retrieved',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          data: { $ref: '#/components/schemas/AISettings' },
                        },
                      },
                    },
                  },
                },
              },
            },
            patch: {
              tags: ['AI - Settings'],
              summary: 'Update AI settings',
              description: 'Update AI feature toggles and budget',
              security: [{ BearerAuth: [] }],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        radarEnabled: { type: 'boolean' },
                        fraudEnabled: { type: 'boolean' },
                        retentionEnabled: { type: 'boolean' },
                        dailyBudgetUsd: { type: 'number' },
                        minRadarScore: { type: 'number', minimum: 0, maximum: 100 },
                      },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Settings updated' },
              },
            },
          },
          '/api/admin/ai/costs': {
            get: {
              tags: ['AI - Settings'],
              summary: 'Get AI cost report',
              description: 'Returns spending breakdown from AILog collection',
              security: [{ BearerAuth: [] }],
              parameters: [
                {
                  name: 'from',
                  in: 'query',
                  schema: { type: 'string', format: 'date' },
                  description: 'Start date (YYYY-MM-DD)',
                },
                {
                  name: 'to',
                  in: 'query',
                  schema: { type: 'string', format: 'date' },
                  description: 'End date (YYYY-MM-DD)',
                },
              ],
              responses: {
                200: {
                  description: 'Cost report retrieved',
                  content: {
                    'application/json': {
                      schema: {
                        type: 'object',
                        properties: {
                          status: { type: 'string' },
                          data: {
                            type: 'object',
                            properties: {
                              totalUsd: { type: 'number' },
                              totalTokens: { type: 'integer' },
                              byFeature: { type: 'object' },
                              byModel: { type: 'object' },
                            },
                          },
